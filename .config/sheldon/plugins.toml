# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the config file:
#
# - `sheldon add` to add a new plugin to the config file
# - `sheldon edit` to open up the config file in the default editor
# - `sheldon remove` to remove a plugin from the config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"

# https://sheldon.cli.rs/Examples.html
# zsh-defer の定義より前のプラグインでは使わない。
[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins]

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

# fpath に載ったあと、compdef するプラグインの前。最初の Tab に間に合わせるため遅延しない。
[plugins.compinit]
inline = "autoload -Uz compinit && compinit"

[plugins.zsh-better-npm-completion]
github = "lukechilds/zsh-better-npm-completion"

[plugins.enhancd]
github = "babarot/enhancd"

[plugins.enhancd.hooks]
pre = "export ENHANCD_COMMAND=ecd ENHANCD_FILTER=fzf"

[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"

[plugins.dot]
github = "ssh0/dot"

[plugins.zsh-mask]
github = "jgogstad/zsh-mask"

# 上流は関数を定義するだけでハイライター登録をしない。
# 登録してから zsh-syntax-highlighting を遅延ロードする。
[plugins.url-highlighter]
github = "ascii-soup/zsh-url-highlighter"
use = ["url/url-highlighter.zsh"]

[plugins.url-highlighter.hooks]
pre = "typeset -gA ZSH_HIGHLIGHT_STYLES"
post = """
function _zsh_highlight_highlighter_url_paint() { _zsh_highlight_url_highlighter \"$@\"; }
function _zsh_highlight_highlighter_url_predicate() { _zsh_highlight_url_highlighter_predicate \"$@\"; }
ZSH_HIGHLIGHT_HIGHLIGHTERS=(main url)
"""

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["defer"]

# trapd00r/zsh-syntax-highlighting-filetypes は読み込まない。
# zinit の関数スコープで配列が消え、キー入力のたびにハイライトが失敗していた。
